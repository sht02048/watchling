name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Builds and notarizes while the tests run; only publishing waits for both.
  build:
    runs-on: macos-15
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

      - uses: ./.github/actions/setup

      - run: pnpm lint
      - run: pnpm typecheck

      - name: Import the signing certificate and notary key
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # Each existing keychain path is a separate argument.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-forge make

      - name: Check that the app in the DMG passes Gatekeeper
        run: |
          mount="$(hdiutil attach -nobrowse -readonly build/release/make/dmg/arm64/Watchling.dmg | tail -1 | cut -f3)"
          app="$mount/Watchling.app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
          helper="$app/Contents/Resources/helpers/watchling-hook-emitter"
          codesign -dvv "$helper" 2>&1 | grep -q "Authority=Developer ID Application"
          codesign -dvv "$helper" 2>&1 | grep -q "flags=0x10000(runtime)"
          # Signing defaults also grant camera, microphone, location and photos.
          for binary in "$app" "$helper"; do
            entitlements="$(codesign -d --entitlements - --xml "$binary" 2>/dev/null | plutil -convert json -o - -)"
            if [ "$entitlements" != '{"com.apple.security.cs.allow-jit":true}' ]; then
              echo "::error::Unexpected entitlements for $binary: $entitlements"
              exit 1
            fi
          done
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: build/release/make/dmg/arm64/Watchling.dmg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          # The site links to releases/latest/download/Watchling.dmg, so the unversioned copy stays.
          versioned="Watchling-${GITHUB_REF_NAME#v}.dmg"
          cp Watchling.dmg "$versioned"
          gh release create "$GITHUB_REF_NAME" \
            "$versioned" \
            Watchling.dmg \
            -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Watchling $GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
