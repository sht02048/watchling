<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pagent companions lab</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="companions.css" />
    <script defer src="companions.js"></script>
  </head>
  <body>
    <main class="lab">
      <header>
        <h1>Companions lab</h1>
        <p>
          Tune how running background subagents ride the pet. Click the stage
          for a new variation, tweak the knobs, and Save to keep it.
        </p>
      </header>
      <div class="lab-grid">
        <section>
          <div class="stage lab-stage" data-background="light" id="stage">
            <div class="layers" id="layers">
              <canvas id="back"></canvas>
              <canvas id="pet"></canvas>
              <canvas id="front"></canvas>
            </div>
          </div>
          <div class="state-bar">
            <nav id="modes" aria-label="Mode"></nav>
            <span class="seed">seed <code id="seed"></code></span>
          </div>
          <div class="controls">
            <fieldset id="sizes">
              <legend>Size</legend>
            </fieldset>
            <fieldset id="backgrounds">
              <legend>Background</legend>
            </fieldset>
          </div>
        </section>
        <aside>
          <div id="knobs"></div>
          <div class="save-row">
            <button type="button" id="save">Save</button>
            <span id="saved-to" aria-live="polite"></span>
          </div>
          <h2>Saved configs</h2>
          <ol id="rail"></ol>
        </aside>
      </div>
    </main>
  </body>
</html>
