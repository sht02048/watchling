<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchling playground</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Watchling playground</h1>
        <p>
          Pick a state to see how the pet changes. Number keys and ←→ also
          switch states.
        </p>
      </header>
      <section class="stage" data-background="light">
        <figure>
          <div class="layers actual">
            <canvas class="back"></canvas>
            <canvas id="actual"></canvas>
            <canvas class="front"></canvas>
          </div>
          <figcaption>Actual size</figcaption>
        </figure>
        <figure>
          <div class="layers large">
            <canvas class="back"></canvas>
            <canvas id="large"></canvas>
            <canvas class="front"></canvas>
          </div>
          <figcaption>2×</figcaption>
        </figure>
      </section>
      <div class="state-bar">
        <nav id="states" aria-label="States"></nav>
        <label>
          <input id="cycle" type="checkbox" />
          Cycle every 3s
        </label>
      </div>
      <p id="description" aria-live="polite"></p>
      <div class="controls">
        <fieldset id="backgrounds">
          <legend>Background</legend>
        </fieldset>
        <fieldset id="companions">
          <legend>Background agents</legend>
        </fieldset>
      </div>
    </main>
  </body>
</html>
